<div class="tree-wrapper">
  <div class="tree-header">
    <div class="tree-guide">
      <button class="toggle-button" (click)="goToTroubleshootingGuides()"><span class=" mif-info"></span> <span style="color:  var(--font-primary-color);"> Service Fabric Troubleshooting Guides</span></button>
    </div>
    @if (experience.isNew()) {
      <fieldset class="tree-health-filters">
        <legend>Health</legend>
        <div class="health-choices">
          <label class="health-filter-choice" data-health="OK" [class.enabled]="treeService.tree.showOkItems">
            <input type="checkbox" [checked]="treeService.tree.showOkItems" (change)="treeService.tree.showOkItems = $any($event.target).checked"> Healthy
          </label>
          <label class="health-filter-choice" data-health="Warning" [class.enabled]="treeService.tree.showWarningItems">
            <input type="checkbox" [checked]="treeService.tree.showWarningItems" (change)="treeService.tree.showWarningItems = $any($event.target).checked"> Warning
          </label>
          <label class="health-filter-choice" data-health="Error" [class.enabled]="treeService.tree.showErrorItems">
            <input type="checkbox" [checked]="treeService.tree.showErrorItems" (change)="treeService.tree.showErrorItems = $any($event.target).checked"> Error
          </label>
        </div>
      </fieldset>
      <label class="tree-health-sort"><input type="checkbox" [checked]="treeService.tree.orderbyHealthState" (change)="treeService.tree.orderbyHealthState = $any($event.target).checked; sendHealthStateTelem()"> Sort by health</label>
    } @else {
    <div class="filter-items-container">
      <label class="toggle-wrapper ">
        <app-health-badge [badgeClass]="'badge-ok'" [text]="'OK'"></app-health-badge>

        <app-toggle [(state)]="treeService.tree.showOkItems" color="var(--dark-green)"></app-toggle>
      </label>

      <label class="toggle-wrapper ">
        <app-health-badge [badgeClass]="'badge-warning'" [text]="'Warning'"></app-health-badge>
        <app-toggle [(state)]="treeService.tree.showWarningItems" color="var(--badge-warning)"></app-toggle>
      </label>

      <label class="toggle-wrapper ">
        <app-health-badge [badgeClass]="'badge-error'" [text]="'Error'"></app-health-badge>
        <app-toggle [(state)]="treeService.tree.showErrorItems" color="var(--badge-error)"></app-toggle>
      </label>

      <label class="toggle-wrapper ">
        Sort by Health
        <app-toggle [(state)]="treeService.tree.orderbyHealthState" (stateChange)="sendHealthStateTelem()"></app-toggle>
      </label>
    </div>
    }
    <div class="input-wrapper">
      <app-input (changed)="setSearchText($event)" placeholder="Type to Highlight" label="Highlight items in list"></app-input>
    </div>
  </div>
  <div class="tree-list" #treeContainer data-cy="tree-panel">
    @if (canExpand && !smallWindowSize) {
      <span class="expand-panel-wrapper">
        <button class="expand-panel-button" (click)="setWidth()" title="Expand view to match width of tree">
          <span class=" mif-chevron-right mif-3x"></span>
        </button>
      </span>
    }
    <div class="tree-body" #tree >
      @if (treeService.tree && !treeService.tree.isLoading && !treeService.tree.isEmpty) {
        <div  class="tree-view">
          @if (treeService.tree.childGroupViewModel) {
            <div class="tree" role="tree" data-cy="tree">
              <app-tree-node [node]="treeService.tree.childGroupViewModel" #baseNode></app-tree-node>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
