@if (experience.isNew()) {
  <section class="resource-summary">
    <header><h2>{{healthState ? 'Overview' : 'Properties'}}</h2>@if (healthState) { <span class="resource-health" [attr.data-health]="healthState.badgeClass">{{healthState.text}}</span> }</header>
    @for (item of internalList; track $index) {
      <app-essential-item [item]="item"><ng-container *ngTemplateOutlet="item.ref"></ng-container></app-essential-item>
    }
  </section>
} @else {
<div class="dashboard-wrapper">
  <div class="dashboard dashboard-medium">
    <div class="dashboard-tile flex-center" style="height: 100%;">
      <div class="flex-center"  style="height: 100%;">
        @if (healthState) {
          <div class="badge-container">
            <app-health-badge [badgeClass]="healthState.badgeClass" size="75px"></app-health-badge>
          </div>
        }
        <div class="right-side-wrapper">
          @for (item of internalList; track item; let l = $last) {
            <app-essential-item [ngClass]="l ? '': 'underline'" [item]="item">
              <ng-container *ngTemplateOutlet="item.ref"></ng-container>
            </app-essential-item>
          }
        </div>
      </div>
    </div>
  </div>
</div>
}
