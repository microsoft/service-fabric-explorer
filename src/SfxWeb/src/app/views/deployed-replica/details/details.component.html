@if (replica) {
  @if (experience.isNew()) {
    <div class="resource-details-layout">
      <section class="resource-detail-card" aria-label="General">
        <header class="resource-detail-header"><h2>General</h2></header>
        <div class="resource-detail-body"><app-detail-view-part [data]="replica"></app-detail-view-part></div>
      </section>
      @if (replica.detail && replica.detail.isInitialized) {
        <section class="resource-detail-card" aria-label="Details">
          <header class="resource-detail-header"><h2>Details</h2></header>
          <div class="resource-detail-body"><app-detail-view-part [data]="replica.detail"></app-detail-view-part></div>
        </section>
      }
    </div>
  } @else {
  <div>
    <div class="detail-pane essen-pane">
      <app-detail-view-part [data]="replica"></app-detail-view-part>
    </div>
    @if (replica.detail && replica.detail.isInitialized) {
      <div class="detail-pane essen-pane">
        <h2>
          Details
        </h2>
        <app-detail-view-part [data]="replica.detail"></app-detail-view-part>
      </div>
    }
  </div>
  }
}
