@if (isAnyNodeThrottling) {
  <div data-cy="nodes-throttling-warning">
    <app-warning description="One or more nodes are throttling"></app-warning>
  </div>
}
<div class="tile-container">
  @for (tile of tiles; track tile) {
    <app-dashboard-tile [data]="tile"></app-dashboard-tile>
  }
</div>
<div class="detail-pane essen-pane">
  @if (resourceUsagePartial) {
    <app-health-badge
      text="The 500-event limit was reached. Resource usage coverage may be incomplete, and some nodes may not have current values."
      badgeClass="badge-warning">
    </app-health-badge>
  }
  <app-detail-list [listSettings]="listSettings" [list]="nodes.collection" data-cy="nodesList"></app-detail-list>
</div>
