
name: Build
on: 
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * * # daily

defaults:
  run:
    working-directory: src/SfxWeb

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node 24.x

        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Check for any .only in Cypress e2e test
        run: npm run stop-only

      - name: Build
        run: npm run build:prod

      - name: Test
        run: npm run ci:test

      - name: E2E test
        run: npm run ci:cy-run
        env:
          CYPRESS_COVERAGE: false

      - name: upload failed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cypress-screenshots
          path:  /home/runner/work/service-fabric-explorer/service-fabric-explorer/src/SfxWeb/cypress/*
