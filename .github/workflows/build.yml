
name: Build
on: 
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * * # daily

defaults:
  run:
    working-directory: src/SfxWeb

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node 24.x

        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Check for any .only in Cypress e2e test
        run: npm run stop-only

      - name: Build
        run: npm run build:prod

      - name: Test
        run: npm run ci:test

      - name: E2E test
        run: npm run ci:cy-run
        env:
          CYPRESS_COVERAGE: false

      - name: upload failed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cypress-screenshots
          path:  /home/runner/work/service-fabric-explorer/service-fabric-explorer/src/SfxWeb/cypress/*
